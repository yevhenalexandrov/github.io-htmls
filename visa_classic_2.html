<html lang="uk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Підтвердження покупки</title>
    <link rel="icon" href="data:,">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            max-width: 390px;
            width: 100%;
            padding: 20px;
            background-color: #ffffff;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            overflow-y: auto;
        }

        .icons {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
        }

        .icon {
            height: 50px;
            width: auto;
        }

        .instructions {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            height: 100%;
        }

        .title {
            color: #000000;
            font-size: 24px;
            font-weight: 600;
        }

        .instruction-text {
            max-width: 320px;
            height: 74px;
            padding: 16px;
            border-radius: 9999px;
            background-color: #f5f5f5;
            color: #000000;
            font-size: 16px;
            font-weight: 400;
            display: flex;
            align-items: center;
            margin: 16px auto;
        }

        .timer {
            color: #38a169;
            font-size: 40px;
            font-weight: normal;
            margin-top: 20px;
        }

        .help-section {
            margin-top: 20px;
            max-width: 334px;
            margin-left: auto;
            margin-right: auto;
        }

        .help-header {
            color: #4a5568;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            list-style: none;
        }

        .help-header::-webkit-details-marker,
        .help-header::marker {
            display: none;
            content: none;
        }

        .support-icon {
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .help-section[open] .support-icon {
            transform: rotate(90deg);
        }

        .warning-text {
            color: #718096;
            font-size: 14px;
        }

        .contact-info {
            color: #2d3748;
            font-weight: 600;
            margin-top: 16px;
        }

        .contact-info span {
            display: block;
        }

        .service-info {
            color: #000000;
            margin-top: 12px;
        }

        .oob-fallback {
            margin-top: 20px;
        }

        .oob-fallback input[type="submit"] {
            width: 100%;
            max-width: 280px;
            padding: 14px 24px;
            border: none;
            border-radius: 8px;
            background-color: #38a169;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            letter-spacing: 0.04em;
        }

        html.js .oob-fallback {
            display: none;
        }

        html.js.no-push-js .oob-fallback {
            display: block;
        }

        html:not(.js) .timer,
        html.js.no-push-js .timer {
            display: none;
        }

    </style>
    <script>document.documentElement.classList.add("js");</script>
</head>
<body>
<div class="container">
    <div class="icons">
        <img src="/public/img/AMO.svg" alt="Amo Icon" class="icon" />
        <img src="/public/img/ASVIO.svg" alt="Asvio Icon" class="icon" />
        <img src="/public/img/VisaSecure.png" alt="Visa Icon" class="icon" />
    </div>
    <div class="instructions">
        <h1 class="title" data-i18n="title">Підтвердження покупки</h1>
        <p class="instruction-text" data-i18n="instruction">
            Будь ласка, підтвердіть свою покупку у додатку вашого банку.
        </p>
        <div id="timerDisplay" class="timer">120</div>
        <details class="help-section">
            <summary class="help-header">
                <span data-i18n="helpTitle">Потрібна допомога?</span>
                <svg
                        id="arrow"
                        class="support-icon"
                        width="12"
                        height="13"
                        viewBox="0 0 12 13"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                >
                    <circle cx="6" cy="6.5" r="6" fill="#121212"></circle>
                    <path
                            d="M8.35355 6.85355C8.54882 6.65829 8.54882 6.34171 8.35355 6.14645L5.17157 2.96447C4.97631 2.7692 4.65973 2.7692 4.46447 2.96447C4.2692 3.15973 4.2692 3.47631 4.46447 3.67157L7.29289 6.5L4.46447 9.32843C4.2692 9.52369 4.2692 9.84027 4.46447 10.0355C4.65973 10.2308 4.97631 10.2308 5.17157 10.0355L8.35355 6.85355ZM7 7H8V6H7V7Z"
                            fill="white"
                    ></path>
                </svg>
            </summary>
            <div class="help-content" id="helpContent">
                <p class="warning-text" data-i18n="helpText">
                    Якщо у вас виникли проблеми з підтвердженням, зв'яжіться з нами за
                    наступними номерами:
                </p>
                <div class="contact-info">
                    <span>0 44 323 00 23</span>
                    <span>0 800 30 32 32</span>
                </div>
            </div>
        </details>
        <p class="service-info" data-i18n="serviceInfo">
            Послугу надає ТОВ "АМО ФІНТЕХ".
        </p>
        <form class="oob-fallback" method="POST" action="{{OOB_URL}}">
            <input name="threeDSSessionData" type="hidden" value="{{TRANSACTION_ID}}" />
            <input type="submit" value="Підтвердити" />
        </form>
    </div>
</div>
<script src="/public/push/script.js" onerror="document.documentElement.classList.add('no-push-js')"></script>
<script>
    window.transactionId = "{{TRANSACTION_ID}}";
    window.timer = Number("{{TIMER}}");
    window.getStatusUrl = "{{GET_STATUS_URL}}";
    window.oobUrl = "{{OOB_URL}}";
    window.locale = "{{LOCALE}}";
</script>
</body>
</html>
